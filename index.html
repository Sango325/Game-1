/* Layout: landscape one-screen app. Painted scene fills the screen height; live wooden UI sits in the corners. Portrait shows a "turn the phone" screen. */
:root{
  --ink:#2E2350;
  --wood-hi:#C8854C; --wood:#9A5A2C; --wood-lo:#6B3818; --wood-edge:#4A250F;
  --green:#5DB43C; --green-lo:#3E8E25; --purple:#7E5BEF; --purple-lo:#5A3DC8;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#5E3A1E;color:var(--ink);font-family:var(--body);overflow:hidden;position:fixed;inset:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
.app{position:fixed;inset:0;overflow:hidden}

.title{font-weight:900;line-height:1;letter-spacing:-.01em;display:inline-block;
  background:linear-gradient(#FFF2A8 0%,#FFD23F 45%,#F6A61E 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #8A4A16;paint-order:stroke fill;filter:drop-shadow(0 3px 0 #6B3410) drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.tline{display:flex;align-items:center;justify-content:center;gap:6px}
.sprig{width:34px;height:auto;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.sprig.r{transform:scaleX(-1)}

.wood{background:
   repeating-linear-gradient(92deg,rgba(255,255,255,.05) 0 3px,rgba(0,0,0,.05) 3px 7px,transparent 7px 13px),
   linear-gradient(180deg,var(--wood-hi),var(--wood) 55%,var(--wood-lo));
  box-shadow:inset 0 2px 0 rgba(255,220,170,.55),inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 3px var(--wood-edge),0 5px 0 3px rgba(60,28,8,.55),0 8px 14px rgba(0,0,0,.25)}
.purple .wood{background:linear-gradient(180deg,#A58BFF,var(--purple) 55%,var(--purple-lo));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.2),0 0 0 3px #3F2A9A,0 5px 0 3px rgba(40,20,110,.5),0 8px 14px rgba(0,0,0,.25)}

/* ---------- scene ---------- */
.backdrop{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(18px) brightness(.85);transform:scale(1.05)}
.view{position:absolute;inset:0;overflow:hidden}
.view.py{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.stage{position:absolute;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px var(--wood),0 0 0 7px var(--wood-edge),0 10px 30px rgba(0,0,0,.45)}
.stage.full{border-radius:0;box-shadow:none}
.stage>img.bg{position:absolute;inset:0;width:100%;height:100%}
.z{position:absolute;border-radius:22%}
.glow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.75) 0,rgba(255,250,200,.35) 45%,transparent 70%);animation:glow .8s ease-out forwards}
@keyframes glow{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;background:#fff;color:var(--ink);font-weight:900;font-size:22px;
  padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(46,35,80,.2),0 8px 16px rgba(0,0,0,.2);white-space:nowrap;animation:tag 1.4s ease-out forwards;z-index:3}
@keyframes tag{0%{transform:translate(-50%,-60%) scale(.5);opacity:0}15%{transform:translate(-50%,-110%) scale(1.08);opacity:1}75%{transform:translate(-50%,-115%) scale(1);opacity:1}100%{transform:translate(-50%,-140%);opacity:0}}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;pointer-events:none;animation:fly .7s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.z.hint{animation:hint 1s ease-in-out 3;background:radial-gradient(circle,rgba(255,255,255,.6),transparent 70%)}
@keyframes hint{0%,100%{opacity:.2}50%{opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{translate:0}25%{translate:-8px}75%{translate:8px}}

.corner{position:absolute;z-index:5;display:flex;align-items:center;gap:10px}
.tl{top:calc(10px + var(--st));left:calc(12px + var(--sl))}
.tr{top:calc(10px + var(--st));right:calc(12px + var(--sr))}
.bl{bottom:calc(10px + var(--sb));left:calc(12px + var(--sl))}
.bc{bottom:calc(6px + var(--sb));left:50%;transform:translateX(-50%)}
.tr{flex-direction:column;align-items:flex-end}
.br{bottom:calc(10px + var(--sb));right:calc(12px + var(--sr))}
.back,.round{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none}
.back svg{width:26px;height:26px;filter:drop-shadow(0 2px 0 rgba(70,30,5,.8))}
.round svg{width:26px;height:26px;filter:drop-shadow(0 2px 0 rgba(70,30,5,.8))}
.round.off{filter:saturate(.3) brightness(.85)}
.toggle{position:relative;display:flex;padding:5px;border-radius:999px}
.toggle .track{display:flex;flex-direction:column;gap:2px;border-radius:999px;background:rgba(60,26,6,.55);box-shadow:inset 0 2px 4px rgba(0,0,0,.45);padding:3px}
.toggle button{padding:9px 12px;border-radius:999px;font-weight:900;font-size:16px;color:#FFF3DF;text-shadow:0 2px 0 rgba(60,25,5,.8)}
.toggle button[aria-pressed="true"]{background:linear-gradient(#8FDA5A,var(--green) 55%,var(--green-lo));box-shadow:inset 0 2px 0 rgba(230,255,200,.7),0 2px 3px rgba(0,0,0,.35)}
.purple .toggle .track{background:rgba(40,18,120,.45)}
.purple .toggle button[aria-pressed="true"]{background:linear-gradient(#B8A2FF,#8C6CF5);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 2px 3px rgba(0,0,0,.3)}
.leaf{position:absolute;right:-6px;top:-14px;width:40px;pointer-events:none}
.tr .count{order:2}
.count{display:flex;align-items:center;gap:4px;padding:4px 14px 4px 6px;border-radius:999px;color:#FFF3DF;font-weight:900;font-size:20px;text-shadow:0 2px 0 rgba(60,25,5,.8);font-variant-numeric:tabular-nums}
.count img{width:30px;height:30px}
.bubble{display:flex;align-items:center;gap:8px;padding:3px 16px 3px 3px;border-radius:999px;max-width:min(60vw,420px)}
.bubble .ic{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#7E4220,#5E2F12)}
.bubble .ic img{width:26px;height:26px}
.bubble .bt{font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(40,20,5,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bubble.in{animation:bin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bin{from{transform:scale(.8)}to{transform:scale(1)}}

/* ---------- home ---------- */
.home{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(12px + var(--st)) calc(16px + var(--sr)) calc(28px + var(--sb)) calc(16px + var(--sl));
  background:linear-gradient(#8FD0FF 0,#CBEBFF 46%,#9ED96F 46.1%,#7CC655 100%)}
.home .head{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1000px;margin:0 auto 14px}
.home .head .title{font-size:44px}
.home h2{margin:22px auto 14px;max-width:1000px}
.home h2 .title{font-size:30px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;max-width:1000px;margin:0 auto}
.card{position:relative;border-radius:22px;padding:6px;transition:transform .15s}
.card:active{transform:scale(.96)}
.card .pic{display:block;width:100%;aspect-ratio:4/3;border-radius:17px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.card .plq{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);padding:5px 14px;border-radius:999px;font-weight:900;font-size:16px;color:#FFF3DF;text-shadow:0 2px 0 rgba(60,25,5,.8);white-space:nowrap}

/* ---------- turn the phone ---------- */
.rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;
  background:linear-gradient(#8FD0FF,#CBEBFF 60%,#9ED96F 60.1%,#7CC655)}
.rotate svg{width:120px;height:120px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
.rotate .title{font-size:34px}
@media (orientation:portrait) and (max-aspect-ratio:9/10){.rotate{display:flex}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

/* ---------- audio: everything through Web Audio so music can be quiet and duck under the voice ---------- */
const MUSIC=['music/track1.mp3','music/track2.mp3','music/track3.mp3','music/track4.mp3','music/track5.mp3'];
const MUSIC_VOL=.45, MUSIC_DUCK=.12;
let actx=null, musicGain=null, voiceGain=null, musicOn=true, mIdx=Math.floor(Math.random()*MUSIC.length), mSrc=null, mLoading=false;
const buffers={};
try{ musicOn=localStorage.getItem('music')!=='off'; }catch(e){}
try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
function initAudio(){
  if(actx){ if(actx.state!=='running') actx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  actx=new AC();
  musicGain=actx.createGain(); musicGain.gain.value=MUSIC_VOL; musicGain.connect(actx.destination);
  voiceGain=actx.createGain(); voiceGain.gain.value=1; voiceGain.connect(actx.destination);
  // iOS unlock: play one silent frame inside the tap
  const b=actx.createBuffer(1,1,22050), s=actx.createBufferSource(); s.buffer=b; s.connect(actx.destination); s.start(0);
  if(musicOn) startMusic();
}
async function load(url){
  if(buffers[url]) return buffers[url];
  const r=await fetch(url); const ab=await r.arrayBuffer();
  const buf=await new Promise((ok,no)=>actx.decodeAudioData(ab,ok,no));
  buffers[url]=buf; return buf;
}
async function startMusic(){
  if(!actx||mSrc||mLoading||!musicOn) return;
  mLoading=true;
  try{
    const url=MUSIC[mIdx%MUSIC.length]; const buf=await load(url);
    mLoading=false; if(!musicOn) return;
    mSrc=actx.createBufferSource(); mSrc.buffer=buf; mSrc.connect(musicGain);
    mSrc.onended=()=>{ delete buffers[url]; mSrc=null; mIdx++; if(musicOn) startMusic(); };
    mSrc.start();
  }catch(e){ mLoading=false; }
}
function stopMusic(){ if(mSrc){ mSrc.onended=null; try{mSrc.stop()}catch(e){} mSrc=null; } }
function setMusic(on){
  musicOn=on; try{ localStorage.setItem('music',on?'on':'off'); }catch(e){}
  document.querySelectorAll('[data-music]').forEach(b=>b.classList.toggle('off',!on));
  if(on){ initAudio(); startMusic(); } else stopMusic();
}
function duck(down){ if(!musicGain) return; const t=actx.currentTime; musicGain.gain.cancelScheduledValues(t); musicGain.gain.setTargetAtTime(down?MUSIC_DUCK:MUSIC_VOL,t,down?.05:.35); }
document.addEventListener('visibilitychange',()=>{ if(!actx) return; if(document.hidden) actx.suspend(); else actx.resume(); });

let playId=0, vSrc=null;
const EXTRA={agde:'А где у нас',ok2:'Молодец!',ok3:'Умница!',try:'Попробуй ещё!',hello:'Привет! Нажми на картинку.'};
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
function textOf(n){ if(EXTRA[n]) return EXTRA[n]; const v=WORDS[n.slice(2)]; return v?cap(v[0]):''; }
function tts(names){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(names.map(textOf).join(' ')); u.lang='ru-RU'; u.rate=.85; speechSynthesis.speak(u);}catch(e){} }
async function play(names){
  const id=++playId; stopVoice(false); initAudio();
  if(!actx){ tts(names); return; }
  duck(true);
  for(const n of names){
    if(id!==playId) return;
    let buf; try{ buf=await load('voice/'+n+'.mp3'); }catch(e){ continue; }
    if(id!==playId) return;
    await new Promise(res=>{ vSrc=actx.createBufferSource(); vSrc.buffer=buf; vSrc.connect(voiceGain); vSrc.onended=res; vSrc.start(); });
  }
  if(id===playId){ vSrc=null; duck(false); }
}
function stopVoice(full=true){ if(vSrc){ vSrc.onended=null; try{vSrc.stop()}catch(e){} vSrc=null; } if(full){ playId++; duck(false); } }
const snd=k=>WORDS[k]&&WORDS[k][1]?'w_'+k:'n_'+k;
function warm(list){ if(!actx) return; list.forEach(n=>load('voice/'+n+'.mp3').catch(()=>{})); }

/* tall pictures are cut into two halves shown side by side, so the whole scene fits a landscape screen */
const SPLIT={};
const zoneBtn=(z,y0,y1)=>{ const k=100/(y1-y0), t=Math.max(z[2],y0), b=Math.min(z[4],y1);
  return `<button class="z" data-w="${z[0]}" aria-label="${WORDS[z[0]][0]}" style="left:${z[1]}%;top:${(t-y0)*k}%;width:${z[3]-z[1]}%;height:${(b-t)*k}%"></button>`; };
function stagesHTML(){
  const sp=SPLIT[scene.id];
  if(!sp) return `<div class="stage" id="stage"><img class="bg" src="bg/${scene.id}.webp" alt="">${scene.zones.map(z=>zoneBtn(z,0,100)).join('')}</div>`;
  return [[sp[0],sp[1]],[sp[1],sp[2]]].map(([a,b],i)=>`<div class="stage half" data-a="${a}" data-b="${b}"${i?'':' id="stage"'}>
    <img class="bg" src="bg/${scene.id}.webp" alt="" style="inset:auto;left:0;width:100%;top:${-a/(b-a)*100}%;height:${100/(b-a)*100}%">
    ${scene.zones.filter(z=>{ const c=(z[2]+z[4])/2; return i?c>=a:c<b; }).map(z=>zoneBtn(z,a,b)).join('')}</div>`).join('');
}
function fit(){
  const st=document.getElementById('stage'), vw=document.getElementById('view'); if(!st||!scene) return;
  const W=app.clientWidth, H=app.clientHeight, ar=scene.w/scene.h;
  let w,h,full=false;
  const halves=[...document.querySelectorAll('.stage.half')];
  if(halves.length){
    const gap=16, m=8, fr=halves.map(p=>(p.dataset.b-p.dataset.a)/100);
    const k=Math.min((W-2*m-gap)/(2*scene.w),(H-2*m)/(Math.max(...fr)*scene.h));
    const pw=scene.w*k, x0=(W-(2*pw+gap))/2;
    halves.forEach((p,i)=>{ const ph=fr[i]*scene.h*k; p.style.width=pw+'px'; p.style.height=ph+'px'; p.style.left=(x0+i*(pw+gap))+'px'; p.style.top=(H-ph)/2+'px'; });
    vw.classList.remove('py'); return;
  }
  if(ar>=1){
    const side=Math.max(...[...document.querySelectorAll('.corner.tl,.corner.tr,.corner.br')].map(c=>c.offsetWidth))+20;
    const bot=document.querySelector('.corner.bc').offsetHeight+10;
    h=H-bot-6; w=h*ar; if(w>W-2*side){ w=W-2*side; h=w/ar; }
    st.style.width=w+'px'; st.style.height=h+'px'; st.style.left=(W-w)/2+'px'; st.style.top=Math.max(6,(H-bot-h)/2)+'px';
    st.classList.remove('full'); vw.classList.remove('py'); return;
  }
  else { w=Math.min(W*.6,H*1.2); h=w/ar; }
  st.classList.toggle('full',full);
  st.style.width=w+'px'; st.style.height=h+'px'; st.style.left=(W-w)/2+'px';
  const tall=h>H+1; vw.classList.toggle('py',tall);
  st.style.top=tall?'0px':(H-h)/2+'px';
}
addEventListener('resize',()=>setTimeout(fit,60));

function setBubble(text){
  const b=document.getElementById('bubble'); if(!b) return;
  document.getElementById('btext').textContent=text;
  b.classList.remove('in'); b.getBoundingClientRect(); b.classList.add('in');
}
const COLORS=['#FF6B3D','#FFD23F','#5DB43C','#2F9BFF','#7E5BEF','#FF5C9A'];
function burst(el,word,n){
  const st=el.closest('.stage'), r=el.getBoundingClientRect(), s=st.getBoundingClientRect();
  const cx=r.left+r.width/2-s.left, cy=r.top+r.height/2-s.top, size=Math.max(r.width,r.height)*1.15;
  const g=document.createElement('span'); g.className='glow'; g.style.cssText=`left:${cx}px;top:${cy}px;width:${size}px;height:${size}px`;
  st.appendChild(g); setTimeout(()=>g.remove(),850);
  for(let i=0;i<n;i++){
    const d=document.createElement('span'); d.className='spark';
    const a=Math.PI*2*i/n+Math.random()*.5, dist=40+Math.random()*40;
    d.style.cssText=`left:${cx}px;top:${cy}px;background:${COLORS[i%6]};--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px`;
    st.appendChild(d); setTimeout(()=>d.remove(),750);
  }
  if(word){
    st.querySelectorAll('.tag').forEach(t=>t.remove());
    const t=document.createElement('span'); t.className='tag'; t.textContent=word;
    t.style.left=Math.min(Math.max(cx,80),s.width-80)+'px'; t.style.top=Math.max(r.top-s.top,50)+'px';
    st.appendChild(t); setTimeout(()=>t.remove(),1450);
  }
}

/* words the child can actually see (not hidden under the corner buttons) */
function visibleKeys(){
  const vw=document.getElementById('view'), scroll=vw.classList.contains('py');
  const W=app.clientWidth, H=app.clientHeight;
  const blocks=[...document.querySelectorAll('.corner')].map(c=>c.getBoundingClientRect());
  const ok=new Set();
  document.querySelectorAll('.stage .z').forEach(z=>{
    const r=z.getBoundingClientRect(); if(!r.width||!r.height) return;
    const top=scroll?r.top:Math.max(r.top,0), bot=scroll?r.bottom:Math.min(r.bottom,H);
    let area=Math.max(0,Math.min(r.right,W)-Math.max(r.left,0))*Math.max(0,bot-top);
    blocks.forEach(b=>{ area-=Math.max(0,Math.min(r.right,b.right)-Math.max(r.left,b.left))*Math.max(0,Math.min(r.bottom,b.bottom)-Math.max(r.top,b.top)); });
    if(area/(r.width*r.height)>=.6) ok.add(z.dataset.w);
  });
  return [...ok];
}
function showZone(k){
  const vw=document.getElementById('view'), z=document.querySelector(`.z[data-w="${k}"]`); if(!vw||!z||!vw.classList.contains('py')) return;
  const r=z.getBoundingClientRect(); vw.scrollBy({top:r.top+r.height/2-vw.clientHeight/2,behavior:'smooth'});
}
function startFind(silent){
  let ks=visibleKeys().filter(k=>k!==target);
  if(!ks.length) ks=[...new Set(scene.zones.map(z=>z[0]))].filter(k=>k!==target);
  target=ks[Math.floor(Math.random()*ks.length)];
  setBubble('Где '+WORDS[target][0]+'?');
  document.getElementById('count').hidden=false; document.getElementById('cnum').textContent=stars;
  if(!silent) play(['agde','n_'+target]);
}
function tap(el){
  const k=el.dataset.w, word=cap(WORDS[k][0]);
  if(mode==='listen'){ burst(el,word,10); setBubble(word); lastK=k; play([snd(k)]); return; }
  if(busy) return;
  if(!target){ startFind(); return; }
  if(k===target){
    busy=true; stars++; burst(el,word+'!',16);
    document.getElementById('cnum').textContent=stars; setBubble('Молодец! '+word);
    play([Math.random()<.5?'ok2':'ok3','n_'+k]);
    setTimeout(()=>{ busy=false; if(scene&&mode==='find') startFind(); },2600);
  }else{
    burst(el,word,0); const st=el.closest('.stage'); st.classList.remove('shake'); st.getBoundingClientRect(); st.classList.add('shake');
    play(['n_'+k,'try']);
  }
}

app.addEventListener('click',e=>{
  initAudio();
  if(e.target.closest('[data-music]')){ setMusic(!musicOn); return; }
  const go=e.target.closest('[data-go]'); if(go){ open(go.dataset.go); return; }
  if(e.target.closest('[data-home]')){ home(); return; }
  const m=e.target.closest('[data-mode]');
  if(m){
    mode=m.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b===m));
    if(mode==='find'){ stars=0; target=null; busy=false; startFind(); }
    else{ target=null; lastK=null; document.getElementById('count').hidden=true; setBubble('Нажми на картинку'); stopVoice(); }
    return;
  }
  if(e.target.closest('#bubble')){
    if(mode==='find'&&target){
      play(['agde','n_'+target]); showZone(target);
      document.querySelectorAll(`.z[data-w="${target}"]`).forEach(z=>{ z.classList.add('hint'); setTimeout(()=>z.classList.remove('hint'),3100); });
    } else play(lastK?[snd(lastK)]:['hello']);
    return;
  }
  const z=e.target.closest('.z'); if(z) tap(z);
});
// first touch anywhere unlocks sound on iOS
['touchend','pointerup'].forEach(ev=>document.addEventListener(ev,initAudio,{passive:true}));

if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
home();
</script>
